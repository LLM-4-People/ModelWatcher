<div id="notif-panel" role="dialog" aria-label="Notifications">
  <div class="notif-drag-handle" aria-hidden="true"></div>

  <div class="notif-panel-header notif-panel-header-list">
    <h2 class="notif-panel-title">Notifications</h2>
    <button class="notif-close-btn" aria-label="Close notifications">&times;</button>
  </div>

  <div class="notif-panel-header notif-panel-header-back hidden">
    <h2 class="notif-panel-title">Settings</h2>
    <button class="notif-close-btn" aria-label="Close settings">&times;</button>
  </div>

  <div id="notif-view-list" class="notif-view notif-view-active">
    <div id="notif-dropdown-list" class="notif-dropdown-list" role="list" aria-label="Recent notifications"></div>
    <div class="notif-dropdown-footer">
      <button id="notif-mark-read" class="notif-link-btn">Mark all read</button>
    </div>
  </div>

  <div id="notif-view-settings" class="notif-view">
    <div class="notif-settings-body" id="notif-settings-body"></div>
  </div>
</div>
<div id="toast-container" role="status" aria-live="polite" aria-atomic="false"></div>

<script type="module" src="__STATIC_PREFIX__/js/app.js"></script>
</body>
</html>
